# Lab stack — run from deploy/:
#   copy env.lab.example .env.lab
#   docker compose -f docker-compose.lab.yml --env-file .env.lab up --build
# Shop: http://localhost:8080   API via proxy: http://localhost:8080/api
# MinIO console: http://localhost:9001   Mailhog: http://localhost:8025

name: online-shop-lab

services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.lab:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - lab

  frontend:
    build:
      context: ../frontend/my-website
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL}
        STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - lab

  backend:
    build:
      context: ../backend/online-store-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      STORAGE_MINIO_ENDPOINT: ${STORAGE_MINIO_ENDPOINT}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY}
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      APP_PUBLIC_WEB_BASE_URL: ${APP_PUBLIC_WEB_BASE_URL}
      APP_CHECKOUT_SUCCESS_URL: ${APP_CHECKOUT_SUCCESS_URL}
      APP_CHECKOUT_CANCEL_URL: ${APP_CHECKOUT_CANCEL_URL}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      APP_MAIL_FROM_ORDERS: ${APP_MAIL_FROM_ORDERS}
      APP_MAIL_FROM_NOREPLY: ${APP_MAIL_FROM_NOREPLY}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Mailhog has no password. Prod SMTP auth would mark /actuator/health DOWN.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - lab

  db:
    image: postgres:15.20-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lab

  minio:
    # Docker Hub deleted minio/minio. This tag is the last upstream community release.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lab

  minio-init:
    # minio/mc was removed with the server repo. This client still provides `mc`.
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb -p local/online-store-bucket || true;
      exit 0;
      "
    networks:
      - lab

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - lab

networks:
  lab:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
