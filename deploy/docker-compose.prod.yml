# Production stack — run from deploy/ directory:
#   cp env.prod.example .env.prod && nano .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See ../DOCKER.md

name: online-shop-prod

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - web

  frontend:
    build:
      context: ../frontend/my-website
      dockerfile: Dockerfile
      args:
        SITE_URL: https://${DOMAIN}
        STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - web
    # Not published — only Caddy reaches this service

  backend:
    build:
      context: ../backend/online-store-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      STORAGE_MINIO_ENDPOINT: ${STORAGE_MINIO_ENDPOINT}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY}
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      APP_PUBLIC_WEB_BASE_URL: ${APP_PUBLIC_WEB_BASE_URL}
      APP_CHECKOUT_SUCCESS_URL: ${APP_CHECKOUT_SUCCESS_URL}
      APP_CHECKOUT_CANCEL_URL: ${APP_CHECKOUT_CANCEL_URL}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      APP_MAIL_FROM_ORDERS: ${APP_MAIL_FROM_ORDERS}
      APP_MAIL_FROM_NOREPLY: ${APP_MAIL_FROM_NOREPLY}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      # Optional one-shot ADMIN seed (AdminUserSeedRunner). Remove from .env.prod after first login.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - web

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
