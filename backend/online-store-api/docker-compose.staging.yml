# Merge with local infra:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
# See ../../DOCKER.md
version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    image: online-store-api:staging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storedb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/online-store-bucket/
      STORAGE_MINIO_ENDPOINT: http://minio:9000
      STORAGE_MINIO_ACCESS_KEY: minioadmin
      STORAGE_MINIO_SECRET_KEY: minioadmin
      STORAGE_MINIO_BUCKET: online-store-bucket
    depends_on:
      - db
      - minio
