# Staging — same hygiene as prod: secrets from env only.
# Activate with SPRING_PROFILES_ACTIVE=staging (see docker-compose.staging.yml).

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:staging-only-change-me-use-a-long-secret!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_replace_me}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_replace_me}

app.checkout.success-url=${APP_CHECKOUT_SUCCESS_URL:http://localhost:4200/checkout/success}
app.checkout.cancel-url=${APP_CHECKOUT_CANCEL_URL:http://localhost:4200/cart}
app.public-web-base-url=${APP_PUBLIC_WEB_BASE_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.mail.host=${SPRING_MAIL_HOST:mailhog}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:orders@localhost}

storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}
storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT}
storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY}
storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY}
storage.minio.bucket=${STORAGE_MINIO_BUCKET}
