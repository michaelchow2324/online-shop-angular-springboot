spring.application.name=online-store-api
server.port=8080
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (guide 05) — override app.jwt.secret via env in prod (must be >= 32 chars for HS256)
app.jwt.secret=dev-only-change-me-use-a-long-secret-key!!
app.jwt.expiration-ms=86400000

# Local mail via Mailhog (guide 06) — override host/port for real SMTP in prod
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
app.mail.from=orders@localhost
