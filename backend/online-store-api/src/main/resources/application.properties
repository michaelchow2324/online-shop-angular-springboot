spring.application.name=online-store-api
server.port=8080
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (guide 05) — override app.jwt.secret via env in prod (must be >= 32 chars for HS256)
app.jwt.secret=dev-only-change-me-use-a-long-secret-key!!
app.jwt.expiration-ms=86400000
