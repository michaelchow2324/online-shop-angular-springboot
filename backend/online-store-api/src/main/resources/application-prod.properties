# Production profile — secrets from environment only (never commit real values).
# Spring relaxed binding maps ENV_VARS → properties (e.g. STRIPE_SECRET_KEY → stripe.secret-key).
# Missing required ${VAR} placeholders fail loudly at startup.
#
# Datasource is set by deploy compose (SPRING_DATASOURCE_*), not here.
# Do not seed ADMIN from config in prod (omit app.admin.*).

server.port=8080

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Storage — R2 (or compatible); inject via STORAGE_* env
# storage.public-base-url: public CDN/base URL used for product/category images
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}
storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT}
storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY}
storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY}
storage.minio.bucket=${STORAGE_MINIO_BUCKET}

# Instagram Graph API (optional — feed fails only when endpoint is called without a token)
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}

# Stripe (use sk_test_ / test whsec_ until go-live)
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.checkout.success-url=${APP_CHECKOUT_SUCCESS_URL}
app.checkout.cancel-url=${APP_CHECKOUT_CANCEL_URL}

# JWT — must be >= 32 chars for HS256
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Mail — Cloudflare Email Sending SMTP (not Mailhog)
# Host: smtp.mx.cloudflare.net · Port 465 implicit TLS · user literal "api_token"
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
# Fallback if specific Froms are omitted
app.mail.from=${APP_MAIL_FROM}
app.mail.from-orders=${APP_MAIL_FROM_ORDERS:${APP_MAIL_FROM}}
app.mail.from-noreply=${APP_MAIL_FROM_NOREPLY:${APP_MAIL_FROM}}

# Frontend origin for links in email (verify) + checkout
app.public-web-base-url=${APP_PUBLIC_WEB_BASE_URL}

# CORS — comma-separated origins (also set by deploy compose)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Shipping fees: application.yml → ShippingProperties only (not here).
