# Production profile — secrets from environment only (guide 08 §7).
# Never put sk_live_ / real passwords in this file.
#
# Spring relaxed binding also maps env vars (e.g. STRIPE_SECRET_KEY → stripe.secret-key).
# Placeholders below make missing secrets fail loudly at startup.

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — must be >= 32 chars for HS256
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Stripe (live in real prod — never commit keys)
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Checkout return URLs (real domain)
app.checkout.success-url=${APP_CHECKOUT_SUCCESS_URL}
app.checkout.cancel-url=${APP_CHECKOUT_CANCEL_URL}
app.public-web-base-url=${APP_PUBLIC_WEB_BASE_URL}

# CORS — comma-separated origins (also set by deploy compose)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Mail — Cloudflare SMTP / real provider (not Mailhog)
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM}

# Storage — MinIO (staging) or R2 (prod); inject via STORAGE_* env
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}
storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT}
storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY}
storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY}
storage.minio.bucket=${STORAGE_MINIO_BUCKET}

# Shipping fees: application.yml → ShippingProperties only (not here).
# Do not seed ADMIN from config in prod (omit app.admin.*).
