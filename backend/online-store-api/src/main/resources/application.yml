# Default shipping zones (guide 02). Override per profile if needed.
# YAML is nicer for nested maps; Spring Boot merges this with application.properties.
# ROC: Rest of Canada
# REMOTE: Remote areas (NL, NT, NU, YT) Yukon, Northwest Territories, Nunavut 

# Guide 08 — Actuator: only health (+ info). Other endpoints stay off the web surface.
# Docker prod healthcheck hits /actuator/health (see deploy/docker-compose.prod.yml).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Don't leak DB/disk details to anonymous callers
      show-details: never
    info:
      enabled: true
  info:
    # Boot 2.6+/3.x: env contributor is off by default → /actuator/info was {}
    env:
      enabled: true

info:
  app:
    name: online-store-api
    description: Online store API (GST/HST checkout)

app:
  shipping:
    zones:
      # Quote ON — YAML 1.1 treats bare ON/OFF/YES/NO as booleans (key would become "true")
      "ON":
        fee: 9.95
        free-threshold: 75
      ROC:
        fee: 16.95
        free-threshold: 120
      REMOTE:
        fee: 24.95
        free-threshold: 150
  # Guide 08 — abandon unpaid Stripe checkouts after this many hours
  orders:
    pending-payment-ttl-hours: 24
  # Guide 08 — destination GST/HST (Ontario seller). Dual-tax provinces: GST only for now.
  tax:
    default-rate:
      rate: 0.05
      name: GST
    rates:
      # Quote ON — YAML 1.1 treats bare ON as boolean true (same as shipping.zones)
      "ON":
        rate: 0.13
        name: HST
      NB:
        rate: 0.15
        name: HST
      NL:
        rate: 0.15
        name: HST
      NS:
        rate: 0.14
        name: HST
      PE:
        rate: 0.15
        name: HST
      # BC/MB/SK/QC: no entry → default GST 5% only (PST/QST not collected yet)
