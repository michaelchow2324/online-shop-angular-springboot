# Default shipping zones (guide 02). Override per profile if needed.
# YAML is nicer for nested maps; Spring Boot merges this with application.properties.
# ROC: Rest of Canada
# REMOTE: Remote areas (NL, NT, NU, YT) Yukon, Northwest Territories, Nunavut 

app:
  shipping:
    zones:
      # Quote ON — YAML 1.1 treats bare ON/OFF/YES/NO as booleans (key would become "true")
      "ON":
        fee: 9.95
        free-threshold: 75
      ROC:
        fee: 16.95
        free-threshold: 120
      REMOTE:
        fee: 24.95
        free-threshold: 150
  # Guide 08 — abandon unpaid Stripe checkouts after this many hours
  orders:
    pending-payment-ttl-hours: 24
