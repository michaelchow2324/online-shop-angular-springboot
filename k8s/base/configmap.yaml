apiVersion: v1
kind: ConfigMap
metadata:
  name: lovely-dearly-config
  namespace: lovely-dearly
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storedb
  SPRING_DATASOURCE_USERNAME: store
  POSTGRES_DB: storedb
  POSTGRES_USER: store
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  SPRING_FLYWAY_ENABLED: "true"
  STORAGE_PUBLIC_BASE_URL: http://localhost:9000/online-store-bucket/
  STORAGE_MINIO_ENDPOINT: http://minio:9000
  STORAGE_MINIO_BUCKET: online-store-bucket
  APP_PUBLIC_WEB_BASE_URL: http://localhost:8080
  APP_CHECKOUT_SUCCESS_URL: http://localhost:8080/checkout/success
  APP_CHECKOUT_CANCEL_URL: http://localhost:8080/cart
  APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
  APP_MAIL_FROM: orders@localhost
  APP_MAIL_FROM_ORDERS: orders@localhost
  APP_MAIL_FROM_NOREPLY: noreply@localhost
  SPRING_MAIL_HOST: mailhog
  SPRING_MAIL_PORT: "1025"
  JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"