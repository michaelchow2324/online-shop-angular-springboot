<!-- ===== HERO SECTION ===== -->
<section class="lovelydearly-hero p-0">
  <div class="home-slider">
    <app-theme-home-slider [banners]="data()?.content?.home_banner" />
  </div>
</section>
<!-- ===== END HERO ===== -->

<!-- ===== NEW ARRIVALS SLIDER ===== -->
@if(data()?.content?.products_list?.status){
  <div class="lovelydearly-section-wrap">
    <app-theme-title [title]="data()?.content?.products_list" [type]="'basic'" [space]="true" />
    <section class="section-b-space pt-0">
      <div class="container">
        <app-theme-product
          [productIds]="newArrivalIds"
          [style]="'vertical'"
          [slider]="true"
        />
      </div>
    </section>
  </div>
}
<!-- ===== END NEW ARRIVALS ===== -->

<!-- ===== COLLECTIONS / CATEGORIES GRID ===== -->
@if(data()?.content?.categories?.status){
  <section class="section-b-space">
    <div class="container">
      <app-theme-title [title]="data()?.content?.categories" [type]="'basic'" [space]="true" />
      <app-categories
        [style]="'lovelydearly'"
        [categoryIds]="data()?.content?.categories?.category_ids || []"
        [slider]="false"
      />
    </div>
  </section>
}
<!-- ===== END COLLECTIONS ===== -->

<!-- ===== INSTAGRAM FEED ===== -->
@if(instagramMediaData?.status && instagramMediaData?.banners?.length){
  <section class="lovelydearly-instagram instagram section-b-space ratio_square">
    <app-theme-social-media
      [media]="instagramMediaData"
      [class]="'container'"
      [type]="'borderd'"
    />
  </section>
}
<!-- ===== END INSTAGRAM ===== -->
