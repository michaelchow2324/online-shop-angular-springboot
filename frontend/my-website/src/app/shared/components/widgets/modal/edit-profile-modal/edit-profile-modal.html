<div class="modal-header">
  <h3 class="fw-semibold">{{ 'edit_profile' | translate }}</h3>
  <app-button
    [class]="'btn btn-close'"
    [spinner]="false"
    [id]="'profile_modal_close_btn'"
    (click)="modalService.dismissAll('Cancel')"
  >
    <i class="ri-close-line"></i>
  </app-button>
</div>
@if(!flicker){
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="modal-body">
    <div class="row g-4">
      <div class="col-xxl-12">
        <div class="form-box">
          <label class="form-label" for="displayName">{{ 'name' | translate }}</label>
          <input
            class="form-control"
            id="displayName"
            type="text"
            placeholder="{{ 'enter_name' | translate }}"
            formControlName="displayName"
          />
        </div>
      </div>
      <div class="col-12">
        <div class="form-box">
          <label class="form-label" for="email">{{ 'email' | translate }}</label>
          <input
            class="form-control"
            id="email"
            type="text"
            formControlName="email"
          />
          <p class="text-muted small mb-0 mt-1">Email cannot be changed here.</p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <app-button
        [class]="'btn btn-outline btn-md fw-bold'"
        [type]="'button'"
        [spinner]="false"
        [id]="'cancel_profile_btn'"
        (click)="modalService.dismissAll('Cancel')"
      >
        {{ 'cancel' | translate }}
      </app-button>
      <app-button [class]="'btn btn-solid'" [id]="'submit_profile_btn'">
        {{ 'submit' | translate }}
      </app-button>
    </div>
  </div>
</form>
}
